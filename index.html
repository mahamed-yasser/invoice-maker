<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice Maker | Demo by Mahamed Yasser</title><meta name="description" content="Demo invoice generator: line items, tax, discount, currency, print to PDF. Runs in the browser, nothing is uploaded.">
<link rel="stylesheet" href="style.css"></head><body>
<div class="demo-bar">Demo tool. Runs in your browser, nothing is uploaded. Sample data only.</div>
<header class="top"><h1>Invoice Maker</h1><div class="actions"><button id="reset" class="ghost">New invoice</button><button id="print" class="btn">Print / Save PDF</button></div></header>
<main class="layout">
<form id="form" class="panel" autocomplete="off" novalidate>
<h2>Details</h2>
<div class="row2"><label>Your business<input id="from" value="Nile Studio"></label><label>Client<input id="to" value="Delta Trading Co."></label></div>
<div class="row3"><label>Invoice no.<input id="no" value="INV-001"></label><label>Date<input id="date" type="date"></label><label>Currency<select id="cur"><option>USD</option><option>EUR</option><option>EGP</option><option>SAR</option><option>GBP</option></select></label></div>
<h2>Items</h2><div id="items"></div><button type="button" id="add" class="ghost">+ Add item</button>
<div class="row2"><label>Tax %<input id="tax" type="number" min="0" max="100" step="0.1" value="14"></label><label>Discount %<input id="disc" type="number" min="0" max="100" step="0.1" value="0"></label></div>
<label>Notes<textarea id="notes" rows="2">Payment due within 14 days. Thank you for your business.</textarea></label>
<p id="err" class="err" role="alert" hidden></p>
</form>
<section class="panel paper" id="paper" aria-label="Invoice preview">
<div class="ph"><div><h2 id="pFrom"></h2><p class="mut">Invoice <b id="pNo"></b></p></div><div class="mut right">Date<br><b id="pDate"></b></div></div>
<p class="mut">Bill to</p><p class="big" id="pTo"></p>
<table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Total</th></tr></thead><tbody id="pRows"></tbody></table>
<dl class="tot"><div><dt>Subtotal</dt><dd id="tSub"></dd></div><div><dt>Discount</dt><dd id="tDisc"></dd></div><div><dt id="tTaxL">Tax</dt><dd id="tTax"></dd></div><div class="grand"><dt>Total due</dt><dd id="tTot"></dd></div></dl>
<p class="mut" id="pNotes"></p>
</section></main>
<footer>Demo built by Mahamed Yasser. Fictional business and client.</footer>
<script src="app.js"></script></body></html>
